<!DOCTYPE html>
<!-- 版本：v1.22.0 | 更新日期：2026-07-28 | 照片放大並減少留白；臉部課程結尾說明統一更新；臉部經絡鬆筋護理加購框與結尾說明調整 -->
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>經絡養生美容 | 課程介紹</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#241F14;
    --ink-soft:#5A5142;
    --bg:#F2EAD9;
    --card:#FFFFFF;
    --deep-green:#2E2718;
    --herb-green:#3F5636;
    --gold:#8F6530;
    --gold-soft:#E3D2A8;
    --line:#C9BB94;
    --radius:14px;
    --font-title:'Noto Serif TC', serif;
    --font-body:'Noto Sans TC', sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    font-family:var(--font-body);
    background:var(--bg);
    color:var(--ink);
    line-height:1.75;
    font-size:clamp(16px, 1.5vw, 18px);
  }
  .wrap{max-width:960px;margin:0 auto;padding:0 clamp(20px,5vw,48px);}
  a{color:var(--deep-green);}

  /* ---------- Hero ---------- */
  .hero{
    position:relative;
    overflow:hidden;
    padding:clamp(56px,10vw,96px) 0 clamp(64px,9vw,88px);
    text-align:center;
  }
  .hero-decor{position:absolute;inset:0;width:100%;height:100%;opacity:0.55;pointer-events:none;}
  .hero-inner{position:relative;z-index:1;}
  .eyebrow{
    font-size:clamp(13px,1.4vw,16px);
    letter-spacing:2px;
    color:var(--herb-green);
    font-weight:500;
    margin-bottom:14px;
  }
  h1.brand-title{
    font-family:var(--font-title);
    font-weight:700;
    font-size:clamp(30px,5.2vw,52px);
    color:var(--deep-green);
    letter-spacing:2px;
    margin-bottom:16px;
  }
  .hero-tagline{
    font-size:clamp(14px,1.6vw,17px);
    color:var(--ink-soft);
    max-width:520px;
    margin:0 auto 30px;
  }
  .btn-primary{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--deep-green);
    color:var(--bg);
    border:none;
    padding:13px 30px;
    border-radius:30px;
    font-size:clamp(13px,1.3vw,15px);
    font-family:var(--font-body);
    font-weight:500;
    cursor:pointer;
    transition:transform .2s ease, background .2s ease;
  }
  .btn-primary:hover{background:#25392C; transform:translateY(-2px);}
  .btn-primary:focus-visible{outline:2px solid var(--gold); outline-offset:3px;}

  /* ---------- Section headings ---------- */
  .section{padding:clamp(40px,6vw,64px) 0;}
  .section-head{text-align:center; margin-bottom:clamp(28px,4vw,40px);}
  .section-eyebrow{
    font-size:clamp(11px,1vw,12px);
    letter-spacing:2px;
    color:var(--gold);
    font-weight:700;
    margin-bottom:8px;
  }
  .section-title{
    font-family:var(--font-title);
    font-weight:700;
    font-size:clamp(20px,2.6vw,28px);
    color:var(--deep-green);
  }
  .section-sub{
    font-size:clamp(13px,1.3vw,15px);
    color:var(--ink-soft);
    margin-top:8px;
  }

  /* ---------- Course grid ---------- */
  .course-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
    gap:18px;
  }
  .course-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:26px 22px;
    text-align:left;
    cursor:pointer;
    transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
    display:flex;
    flex-direction:column;
    gap:10px;
    font-family:var(--font-body);
  }
  .course-card:hover, .course-card:focus-visible{
    transform:translateY(-4px);
    box-shadow:0 12px 28px rgba(47,74,58,0.12);
    border-color:var(--gold-soft);
    outline:none;
  }
  .course-icon{
    width:34px;height:34px;
    color:var(--gold);
  }
  .course-name{
    font-family:var(--font-title);
    font-weight:700;
    font-size:clamp(16px,1.7vw,18px);
    color:var(--deep-green);
  }
  .course-meta{
    font-size:clamp(12px,1.2vw,13px);
    color:var(--ink-soft);
  }
  .course-price{
    font-size:clamp(17px,1.8vw,20px);
    font-weight:700;
    color:var(--deep-green);
    margin-top:auto;
  }
  .course-price.pending{
    font-size:clamp(13px,1.4vw,15px);
    color:var(--gold);
    font-weight:500;
  }
  .course-cta{
    font-size:12px;
    color:var(--herb-green);
    display:inline-flex;
    align-items:center;
    gap:4px;
  }

  .note-line{
    text-align:center;
    font-size:clamp(12px,1.2vw,13px);
    color:var(--ink-soft);
    margin-top:24px;
  }
  .note-line.reservation-note{
    margin-top:24px;
    margin-bottom:2px;
    color:var(--gold);
    font-weight:500;
  }
  #note-line{margin-top:2px;}

  .line-qr-section{
    text-align:center;
    margin-top:28px;
  }
  .line-qr-title{
    font-size:clamp(13px,1.3vw,14px);
    font-weight:500;
    color:var(--deep-green);
    margin:0 0 12px;
  }
  .line-qr-row{
    display:flex;
    gap:16px;
    justify-content:center;
    flex-wrap:wrap;
  }
  .line-qr-img{
    width:110px;
    height:110px;
    border:1px solid var(--line);
    border-radius:10px;
    background:#fff;
    padding:6px;
  }

  /* ---------- Category tabs ---------- */
  .category-tabs{
    display:flex;
    gap:10px;
    justify-content:center;
    flex-wrap:wrap;
    margin-bottom:28px;
  }
  .category-tab{
    background:var(--card);
    border:1px solid var(--line);
    color:var(--ink-soft);
    font-size:13px;
    font-family:var(--font-body);
    font-weight:500;
    padding:9px 20px;
    border-radius:20px;
    cursor:pointer;
    transition:background .2s ease, color .2s ease, border-color .2s ease;
  }
  .category-tab.active{
    background:var(--herb-green);
    color:var(--bg);
    border-color:var(--herb-green);
  }

  /* ---------- Facial course card price / items ---------- */
  .course-original-price{
    font-size:11px;
    color:#9A8F7A;
    text-decoration:line-through;
    margin:0;
  }
  .course-items-line{
    font-size:11px;
    color:var(--ink-soft);
    margin-top:6px;
  }

  /* ---------- Add-on section ---------- */
  .addon-box{
    margin-top:32px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px 22px;
  }
  .addon-title{
    font-size:14px;
    font-weight:700;
    color:var(--deep-green);
    margin-bottom:10px;
  }
  .addon-row{
    display:flex;
    justify-content:space-between;
    font-size:13px;
    color:var(--ink-soft);
    padding:6px 0;
  }
  .addon-row span:last-child{
    font-weight:700;
    color:var(--gold);
  }

  /* ---------- Brand section ---------- */
  .brand-section{
    background:var(--card);
    border-radius:var(--radius);
    border:1px solid var(--line);
    padding:clamp(26px,4vw,36px);
    display:flex;
    flex-wrap:wrap;
    gap:24px;
    align-items:center;
    justify-content:space-between;
  }
  .brand-item{flex:1; min-width:200px;}
  .brand-label{
    font-size:12px;
    letter-spacing:1px;
    color:var(--gold);
    font-weight:700;
    margin-bottom:6px;
  }
  .brand-name{
    font-family:var(--font-title);
    font-size:clamp(15px,1.6vw,18px);
    color:var(--deep-green);
    font-weight:700;
  }
  .brand-name a{text-decoration:none; border-bottom:1px dotted var(--herb-green);}

  /* ---------- Detail view ---------- */
  #view-detail{display:none;}
  #view-detail.active{display:block;}
  #view-home.hidden{display:none;}

  .detail-hero{
    padding:clamp(36px,6vw,56px) 0 clamp(24px,4vw,32px);
  }
  .back-btn{
    display:inline-flex;
    align-items:center;
    gap:6px;
    background:none;
    border:1px solid var(--line);
    color:var(--deep-green);
    padding:9px 18px;
    border-radius:24px;
    font-size:13px;
    font-family:var(--font-body);
    cursor:pointer;
    margin-bottom:24px;
    transition:background .2s ease;
  }
  .back-btn:hover{background:var(--gold-soft);}
  .detail-eyebrow{
    font-size:clamp(12px,1.2vw,14px);
    letter-spacing:2px;
    color:var(--gold);
    font-weight:500;
    margin:0 0 8px;
  }
  .detail-title{
    font-family:var(--font-title);
    font-weight:700;
    font-size:clamp(26px,4vw,38px);
    color:var(--deep-green);
    margin-bottom:10px;
  }
  .detail-meta-row{
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    font-size:clamp(14px,1.4vw,16px);
    color:var(--ink-soft);
    margin-bottom:28px;
  }
  .detail-meta-row span.price{
    color:var(--deep-green);
    font-weight:700;
    font-size:clamp(17px,1.8vw,19px);
  }
  .detail-tags{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:32px;
  }
  .tag{
    background:var(--gold-soft);
    color:#4A3212;
    font-size:13px;
    padding:6px 14px;
    border-radius:20px;
  }
  .detail-body p{
    font-size:clamp(16px,1.6vw,18px);
    color:var(--ink);
    margin-bottom:16px;
    max-width:640px;
  }
  .detail-footnote{
    font-size:clamp(13px,1.3vw,14px);
    color:var(--ink-soft);
    margin-top:24px;
    border-top:1px solid var(--line);
    padding-top:16px;
  }

  /* ---------- Tier cards (multi-price courses) ---------- */
  .tier-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
    gap:14px;
    margin-bottom:8px;
  }
  .tier-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:12px;
    padding:18px;
  }
  .tier-card.featured{
    border:2px solid var(--herb-green);
  }
  .tier-badge{
    display:inline-block;
    background:var(--gold-soft);
    color:#4A3212;
    font-size:11px;
    font-weight:500;
    padding:4px 12px;
    border-radius:6px;
    margin-bottom:10px;
  }
  .tier-name{
    font-size:15px;
    font-weight:700;
    color:var(--deep-green);
    margin:0 0 2px;
  }
  .tier-meta{
    font-size:12px;
    color:var(--ink-soft);
    margin:0 0 12px;
  }
  .tier-label{
    font-size:12px;
    font-weight:700;
    color:var(--deep-green);
    margin:10px 0 3px;
  }
  .tier-text{
    font-size:12px;
    color:var(--ink-soft);
    margin:0 0 6px;
  }
  .tier-list{
    font-size:12px;
    color:var(--ink-soft);
    margin:0 0 6px 16px;
    padding:0;
  }
  .tier-list li{margin-bottom:3px;}

  .feature-list{
    font-size:clamp(13px,1.4vw,14px);
    color:var(--ink);
    margin:0 0 20px 18px;
    padding:0;
  }
  .feature-list li{margin-bottom:6px;}

  .caution-box{
    background:#F3E1D3;
    border-radius:10px;
    padding:14px 16px;
    margin-bottom:8px;
  }
  .caution-title{
    font-size:12px;
    font-weight:700;
    color:#8A3F22;
    margin:0 0 4px;
  }
  .caution-text{
    font-size:12px;
    color:#6B4536;
    margin:0;
  }
  .detail-intro{
    font-size:clamp(14px,1.5vw,16px);
    color:var(--ink);
    margin-bottom:22px;
    max-width:640px;
  }

  /* ---------- Detail photo gallery ---------- */
  .detail-gallery{
    display:flex;
    align-items:flex-start;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
    margin:0 auto 16px;
    max-width:560px;
  }
  .detail-gallery img{
    width:auto;
    height:auto;
    max-width:190px;
    max-height:240px;
    border-radius:12px;
    display:block;
    filter:blur(0.3px) brightness(1.04) contrast(0.95) saturate(0.96);
  }
  .detail-photo{
    max-width:420px;
    width:auto;
    height:auto;
    max-height:340px;
    border-radius:12px;
    display:block;
    margin:0 auto 14px;
    filter:blur(0.3px) brightness(1.04) contrast(0.95) saturate(0.96);
  }

  /* ---------- Studio section ---------- */
  .studio-section{
    padding:0 0 clamp(40px,6vw,64px);
  }
  .studio-photo{
    max-width:600px;
    width:auto;
    height:auto;
    max-height:400px;
    border-radius:var(--radius);
    display:block;
    margin:0 auto;
    filter:blur(0.3px) brightness(1.04) contrast(0.95) saturate(0.96);
  }
  .studio-caption{
    text-align:center;
    font-size:clamp(13px,1.3vw,15px);
    color:var(--ink-soft);
    margin-top:14px;
  }

  /* ---------- Comparison section ---------- */
  .comparison-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:10px;
    margin-bottom:20px;
  }
  .comparison-card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
  }
  .comparison-card.highlight{
    border-color:var(--herb-green);
  }
  .comparison-label{
    font-size:12px;
    font-weight:700;
    margin:0 0 5px;
  }
  .comparison-text{
    font-size:12px;
    color:var(--ink-soft);
    margin:0;
  }

  /* ---------- Addon box ---------- */
  .addon-detail-box{
    background:var(--bg);
    border:1px solid var(--line);
    border-radius:12px;
    padding:18px 20px;
    margin-bottom:20px;
  }
  .addon-detail-title{
    font-size:13px;
    font-weight:700;
    color:var(--deep-green);
    margin:0 0 10px;
  }
  .addon-detail-title .addon-detail-price{
    color:var(--gold);
    font-weight:700;
  }
  .addon-detail-intro{
    font-size:12px;
    color:var(--ink-soft);
    margin:0 0 12px;
    line-height:1.75;
  }
  .addon-detail-item{
    background:var(--card);
    border-radius:8px;
    padding:10px 12px;
    margin-bottom:8px;
    font-size:12px;
    color:var(--ink-soft);
    line-height:1.7;
  }
  .addon-detail-item:last-child{margin-bottom:0;}
  .addon-detail-item strong{color:var(--deep-green);}

  /* ---------- Footer ---------- */
  footer{
    border-top:1px solid var(--line);
    padding:clamp(28px,4vw,36px) 0 clamp(20px,3vw,28px);
  }
  .footer-bottom{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
  }
  .version-tag{
    font-size:11px;
    color:#B8B199;
    letter-spacing:0.5px;
  }

  .detail-hero{text-align:center;}
  .back-btn{margin-left:auto; margin-right:auto;}
  .detail-meta-row{justify-content:center;}
  .detail-tags{justify-content:center;}
  .detail-body p{text-align:center; margin-left:auto; margin-right:auto;}
  .detail-footnote{text-align:center;}
  .tier-card{text-align:center;}
  .tier-list{display:inline-block; text-align:left;}
  .feature-list{display:inline-block; text-align:left;}
  .comparison-grid{justify-content:center;}
  .addon-detail-item{text-align:center;}

  @media (max-width:520px){
    .brand-section{flex-direction:column; align-items:flex-start;}
  }
</style>
</head>
<body>

<div id="view-home">

  <header class="hero">
    <svg class="hero-decor" viewBox="0 0 960 320" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <g stroke="#2E2718" stroke-width="1.6" fill="none" opacity="0.28">
        <path d="M40 300 C 70 230 55 170 100 110 C 130 68 170 45 200 18"/>
        <path d="M80 260 C 100 240 108 212 130 190"/>
        <path d="M95 215 C 112 200 126 192 146 180"/>
        <path d="M920 310 C 875 235 890 170 835 108 C 800 66 755 42 715 16"/>
        <path d="M878 265 C 856 244 842 216 818 195"/>
        <path d="M858 220 C 838 205 820 196 798 186"/>
      </g>
      <g fill="#3F5636" opacity="0.45">
        <ellipse cx="108" cy="118" rx="17" ry="8.5" transform="rotate(-35 108 118)"/>
        <ellipse cx="142" cy="80" rx="17" ry="8.5" transform="rotate(-18 142 80)"/>
        <ellipse cx="833" cy="126" rx="17" ry="8.5" transform="rotate(32 833 126)"/>
        <ellipse cx="792" cy="88" rx="17" ry="8.5" transform="rotate(16 792 88)"/>
      </g>
      <g fill="#8F6530" opacity="0.55">
        <circle cx="200" cy="18" r="7"/>
        <circle cx="715" cy="16" r="7"/>
        <circle cx="146" cy="180" r="4"/>
        <circle cx="798" cy="186" r="4"/>
      </g>
    </svg>
    <div class="wrap hero-inner">
      <p class="eyebrow">人身難得 · 經絡養生美容</p>
      <h1 class="brand-title">循經而養 · 由內而外</h1>
      <p class="hero-tagline">結合古法經絡手感與精油調理，為每一種體質與需求，設計溫和而深層的循環美學課程。</p>
      <button class="btn-primary" onclick="document.getElementById('courses').scrollIntoView()">
        探索課程
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  </header>

const ICONS = {
  leaf: '<svg class="course-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 20c8 0 15-6 16-16-10 1-16 8-16 16Z"/><path d="M6 18c3-4 7-7 12-9"/></svg>',
  sun: '<svg class="course-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="4.5"/><path d="M12 3v2.2M12 18.8V21M4.2 12H2M22 12h-2.2M5.6 5.6l1.5 1.5M16.9 16.9l1.5 1.5M18.4 5.6l-1.5 1.5M7.1 16.9l-1.5 1.5"/></svg>',
  sculpt: '<svg class="course-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3c3 3 3 6 0 9-3 3-3 6 0 9"/><path d="M7 7c1.6 1.6 1.6 3.4 0 5M17 12c1.6 1.6 1.6 3.4 0 5"/></svg>',
  foot: '<svg class="course-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M9 21c-2 0-3-1.3-3-3.4 0-2.3 1-3.6 1-6.1C7 8 6 6.5 6 5c0-1.3 1-2 2.2-2C10 3 11 5 11 7.5c0 2 .6 3 1.6 3.9C14 12.6 15 14 15 16.5c0 2.7-1.5 4.5-3.5 4.5H9Z"/></svg>',

  aroma: '<svg class="course-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 3c2.5 3 4 5.6 4 8a4 4 0 0 1-8 0c0-2.4 1.5-5 4-8Z"/><path d="M6 21c1-2 3-3 6-3s5 1 6 3"/></svg>'
};

const ADDONS = {
  balance: [],
  facial: [
    { name: "頭肩頸深層磁性鬆筋", price: "NT$1,000" }
  ]
};

const CATEGORY_LABELS = {
  balance: "經絡平衡調理",
  facial: "臉部經絡美學護理"
};

const CATEGORY_NOTE = {
  balance: "建議調理頻率：每2週一次，效果更持續",
  facial: "本分類課程均使用軟水系統"
};

let activeCategory = "balance";

function renderTabs(){
  const tabs = document.getElementById('category-tabs');
  tabs.innerHTML = Object.keys(CATEGORY_LABELS).map(key => `
    <button class="category-tab ${key === activeCategory ? 'active' : ''}" onclick="setCategory('${key}')">${CATEGORY_LABELS[key]}</button>
  `).join('');
}

const BRANDS = {
  balance: [
    { label: "調理油品牌", name: "揚生生化科技－漢本草精油系列", url: "http://www.yangsen.com.tw/" },
    { label: "調理油品牌", name: "肯園 OSHADHI", url: "https://www.canjune.com/" }
  ],
  facial: [
    { label: "保養品牌", name: "德卡 dermalogica", url: "https://www.dermalogica.com.tw/" },
    { label: "保養品牌", name: "劉大夫科學萃取漢方專科保養品", url: "https://beautyliu.com/" },
    { label: "保養品牌", name: "寶齡富錦", url: "https://www.pbf.com.tw/" }
  ]
};

function renderBrands(){
  const container = document.getElementById('brand-section');
  const list = BRANDS[activeCategory] || [];
  container.innerHTML = list.map(b => `
    <div class="brand-item">
      <p class="brand-label">${b.label}</p>
      <p class="brand-name"><a href="${b.url}" target="_blank" rel="noopener">${b.name} ↗</a></p>
    </div>
  `).join('');
}

function setCategory(key){
  activeCategory = key;
  renderTabs();
  renderGrid();
  renderAddons();
  renderBrands();
  document.getElementById('note-line').textContent = CATEGORY_NOTE[key] || '';
}

function renderGrid(){
  const grid = document.getElementById('course-grid');
  const list = COURSES.filter(c => c.category === activeCategory);
  grid.innerHTML = list.map(c => `
    <div class="course-card" tabindex="0" role="button" data-id="${c.id}" onclick="showDetail('${c.id}')" onkeydown="if(event.key==='Enter')showDetail('${c.id}')">
      ${ICONS[c.icon]}
      <p class="course-name">${c.name}</p>
      <p class="course-meta">${c.duration || c.subtitle || ''}</p>
      ${c.originalPrice ? `<p class="course-original-price">原價 ${c.originalPrice}</p>` : ''}
      ${c.priceLabel ? `<p class="course-original-price" style="text-decoration:none;color:var(--gold)">${c.priceLabel}</p>` : ''}
      <p class="${c.priceState==='pending' ? 'course-price pending' : 'course-price'}">${c.originalPrice ? '體驗價 ' : ''}${c.price}</p>
      ${c.tags && c.category === 'facial' ? `<p class="course-items-line">${c.tags.join('．')}</p>` : ''}
      <span class="course-cta">查看課程內容
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </span>
    </div>
  `).join('');
}

function renderAddons(){
  const container = document.getElementById('addon-section');
  const list = ADDONS[activeCategory] || [];
  if(list.length === 0){
    container.innerHTML = '';
    return;
  }
  container.innerHTML = `
    <div class="addon-box">
      <p class="addon-title">可加購項目</p>
      ${list.map(a => `<div class="addon-row"><span>${a.name}</span><span>${a.price}</span></div>`).join('')}
    </div>
  `;
}

function showDetail(id){
  const c = COURSES.find(x => x.id === id);
  if(!c) return;
  document.getElementById('d-eyebrow').textContent = c.eyebrow || '';
  document.getElementById('d-title').textContent = c.titleSuffix ? `${c.name} — ${c.titleSuffix}` : c.name;
  document.getElementById('d-duration').textContent = c.duration || c.subtitle || '';
  document.getElementById('d-price').textContent = c.originalPrice
    ? `體驗價 ${c.price}（原價 ${c.originalPrice}）`
    : (c.priceLabel ? c.priceLabel + ' ' : '') + c.price + (c.priceNote ? '（' + c.priceNote + '）' : '');
  document.getElementById('d-tags').innerHTML = c.tags.map(t => `<span class="tag">${t}</span>`).join('');

  if(c.tiers){
    let html = `<p class="detail-intro">${c.intro}</p>`;
    if(c.gallery && c.gallery.length){
      html += `<div class="detail-gallery">${c.gallery.map(src => `<img src="data:image/jpeg;base64,${src}" alt="${c.name}">`).join('')}</div>`;
    }
    html += `<div class="tier-grid">`;
    html += c.tiers.map(t => `
      <div class="tier-card ${t.badge ? 'featured' : ''}">
        ${t.badge ? `<span class="tier-badge">${t.badge}</span>` : ''}
        <p class="tier-name">${t.name} · ${t.price}</p>
        ${t.meta ? `<p class="tier-meta">${t.meta}</p>` : ''}
        ${t.audience ? `<p class="tier-label">適合對象</p><p class="tier-text">${t.audience}</p>` : ''}
        ${t.items && t.items.length ? `<p class="tier-label">包含項目</p><ul class="tier-list">${t.items.map(i => `<li>${i}</li>`).join('')}</ul>` : ''}
        ${t.highlight ? `<p class="tier-label">主要療效強調</p><p class="tier-text">${t.highlight}</p>` : ''}
        ${t.tierNote ? `<p class="tier-text" style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)">${t.tierNote}</p>` : ''}
      </div>
    `).join('');
    html += `</div>`;
    if(c.features){
      html += `<p class="tier-label" style="font-size:14px;margin-top:18px">課程特色</p>`;
      html += `<ul class="feature-list">${c.features.map(f => `<li>${f}</li>`).join('')}</ul>`;
    }
    if(c.comparison){
      html += `<p class="tier-label" style="font-size:14px;margin-top:4px">${c.comparison.title}</p>`;
      html += `<div class="comparison-grid">`;
      html += c.comparison.items.map(i => `
        <div class="comparison-card ${i.highlight ? 'highlight' : ''}">
          <p class="comparison-label" style="color:${i.highlight ? 'var(--herb-green)' : 'var(--ink-soft)'}">${i.label}</p>
          <p class="comparison-text">${i.text}</p>
        </div>
      `).join('');
      html += `</div>`;
    }
    if(c.addonBox){
      const ab = c.addonBox;
      html += `<div class="addon-detail-box">`;
      html += `<p class="addon-detail-title">${ab.title}　<span class="addon-detail-price">${ab.price}</span></p>`;
      html += `<p class="addon-detail-intro">${ab.intro}</p>`;
      html += ab.items.map(i => `<div class="addon-detail-item">${i.icon} <strong>${i.label}</strong>：${i.text}</div>`).join('');
      html += `</div>`;
    }
    if(c.caution){
      html += `<div class="caution-box"><p class="caution-title">注意事項</p><p class="caution-text">${c.caution}</p></div>`;
    }
    document.getElementById('d-body').innerHTML = html;
  } else {
    let html = '';
    if(c.image){
      html += `<img class="detail-photo" src="data:image/jpeg;base64,${c.image}" alt="${c.name}">`;
    }
    html += c.body.map(p => `<p>${p}</p>`).join('');
    document.getElementById('d-body').innerHTML = html;
  }

  document.getElementById('d-footnote').innerHTML = c.footnote || '';

  document.getElementById('view-home').classList.add('hidden');
  document.getElementById('view-detail').classList.add('active');
  window.scrollTo(0,0);
}

function showHome(){
  document.getElementById('view-detail').classList.remove('active');
  document.getElementById('view-home').classList.remove('hidden');
  window.scrollTo(0,0);
}

renderTabs();
renderGrid();
renderAddons();
renderBrands();
</script>

</body>
</html>
